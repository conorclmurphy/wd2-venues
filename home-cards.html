<style>
/* Wedding Day 2 home page: the four service cards. One light block instead of four image blocks.
   A card never grows or moves up when pointed at or tapped (only a ring, and a slight press-in), so it cannot cross the blue line. */
.wd2-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;width:92%;margin:0 auto;padding:1px 0 0;container-type:inline-size}
.wd2-cards a{display:block;position:relative;aspect-ratio:231/336;border-radius:20px;overflow:hidden;background:#0e2628;transition:transform .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent}
.wd2-cards img{display:block;width:100%!important;height:100%!important;object-fit:cover;border-radius:0!important}
.wd2-cards a:hover{box-shadow:0 0 0 2px rgba(61,194,187,.65),0 10px 26px rgba(0,0,0,.45)}
.wd2-cards a:active{transform:scale(.97);box-shadow:0 0 0 2px rgba(61,194,187,.75)}
.wd2-cards a:focus-visible{outline:3px solid #3dc2bb;outline-offset:3px}
.fluid-engine:has(.wd2-cards){display:block!important}
.fe-block:has(.wd2-cards),.fe-block:has(.wd2-cards) .sqs-block{display:block!important;width:auto!important;height:auto!important;padding:0!important;margin:0!important}
/* The background is Squarespace's own animated one again (set on the section itself), so it is exactly the original. Its play/pause button is hidden. */
section.page-section:has(.wd2-cards) .background-pause-button{display:none!important}
/* on bigger screens the cards keep the same height the old layout gave them at every width */
@supports (height:1cqw){@media (min-width:768px){.wd2-cards a{aspect-ratio:auto;height:calc(23.65cqw + 110px)}}}
@media (max-width:767px){.wd2-cards{grid-template-columns:repeat(2,minmax(0,1fr));width:auto;margin:0 24px}.wd2-cards a{aspect-ratio:167/234}}
@media (hover:none){.wd2-cards a:hover{box-shadow:none}}
</style>
